name: Build Native Kotlin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Lightweight Native Kotlin Project
        run: |
          mkdir -p app/src/main/java/com/example/calculator
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/raw

          cp *.kt app/src/main/java/com/example/calculator/ 2>/dev/null || true
          
          # איסוף אוטומטי של כל קובצי השמע שתעלה למאגר גיטהאב לתוך האפליקציה (siren, sound3-12)
          cp *.mp3 app/src/main/res/raw/ 2>/dev/null || true

          # הורדת צלילי בסיס מהאינטרנט (רק אם לא העלית במקומם קובץ משלך)
          wget -nc -qO app/src/main/res/raw/cheer.mp3 "https://www.myinstants.com/media/sounds/kids_cheering.mp3" || true
          wget -nc -qO app/src/main/res/raw/sound1.mp3 "https://www.myinstants.com/media/sounds/iphone-original-keyboard-sound.mp3" || true
          wget -nc -qO app/src/main/res/raw/sound2.mp3 "https://www.myinstants.com/media/sounds/mouse-click-sound.mp3" || true

          cat << 'EOF' > app/src/main/res/drawable/ic_calc_tile.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M19,3H5C3.9,3 3,3.9 3,5v14c0,1.1 0.9
                      cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#262F45" android:pathData="M33,24h42c3.3,0 6,2.7 6,6v48c0,3.3 -2.7,6 -6,6H33c-3.3,0 -6,-2.7 -6,-6V30c0,-3.3 2.7,-6 6,-6z"/><path android:fillColor="#0D0F14" android:pathData="M33,30h42v14H33z"/><path android:fillColor="#FFFFFF" android:pathData="M33,50h11v11H33zM48.5,50h11v11h-11zM33,65h11v11H33zM48.5,65h11v11h-11z"/><path android:fillColor="#64B5F6" android:pathData="M64,50h11v11H64z"/><path android:fillColor="#00E676" android:pathData="M64,65h11v11H64z"/></vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "NativeCalculator"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.calculator'
              compileSdk 34
              defaultConfig { applicationId "com.example.calculator"; minSdk 26; targetSdk 34; versionCode 6; versionName "6.0-Pro" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="מחשבון Pro" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:supportsRtl="false" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:supportsPictureInPicture="true" android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".CalculatorWidget" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
                  </receiver>

                  <service android:name=".MiniCalcTileService" android:icon="@drawable/ic_calc_tile" android:label="מיני מחשבון" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE" android:exported="true">
                      <intent-filter><action android:name="android.service.quicksettings.action.QS_TILE" /></intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build Signed Native APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
