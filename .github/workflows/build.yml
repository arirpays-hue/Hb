name: Build Native Kotlin APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Lightweight Native Kotlin Project
        run: |
          mkdir -p /tmp/audio_backup
          # פקודת חיפוש חכמה הסורקת את כל התיקיות במאגר ואוספת את כל הצלילים ללא יוצא מן הכלל
          find . -type f -name "*.mp3" -exec cp {} /tmp/audio_backup/ \; 2>/dev/null || true

          mkdir -p app/src/main/java/com/example/calculator
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/raw

          cp *.kt app/src/main/java/com/example/calculator/ 2>/dev/null || true
          cp /tmp/audio_backup/*.mp3 app/src/main/res/raw/ 2>/dev/null || true

          # מוחק אוטומטית קבצים שאינם תקינים (למניעת קריסות)
          find app/src/main/res/raw/ -type f ! -name "*.mp3" -delete || true

          cat << 'EOF' > app/src/main/res/drawable/ic_calc_tile.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M19,3H5C3.9,3,3,3.9,3,5v14c0,1.1,0.9,2,2,2h14c1.1,0,2,-0.9,2,-2V5C21,3.9,20.1,3,19,3z M7,7h4v2H7V7z M7,11h4v2H7V11z M7,15h4v2H7V15z M17,17h-4v-2h4V17z M17,13h-4v-2h4V13z M17,9h-4V7h4V9z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="200dp"
              android:minHeight="60dp"
              android:updatePeriodMillis="86400000"
              android:initialLayout="@layout/widget_layout"
              android:resizeMode="horizontal"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:background="@drawable/widget_bg"
              android:padding="8dp"
              android:gravity="center">
              <Button
                  android:id="@+id/btn_wid_calc"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:text="🧮"
                  android:background="#00000000"
                  android:textSize="22sp"/>
              <Button
                  android:id="@+id/btn_wid_coin"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:text="💵"
                  android:background="#00000000"
                  android:textSize="22sp"/>
              <Button
                  android:id="@+id/btn_wid_sci"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:text="🔬"
                  android:background="#00000000"
                  android:textSize="22sp"/>
          </LinearLayout>
          EOF
                    cat << 'EOF' > app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#D91E2433"/>
              <corners android:radius="24dp"/>
              <stroke android:width="1dp" android:color="#4A5266"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/calculator/CalculatorWidget.kt
          package com.example.calculator
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          class CalculatorWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (appWidgetId in appWidgetIds) {
                      val views = RemoteViews(context.packageName, context.resources.getIdentifier("widget_layout", "layout", context.packageName))
                      val piCalc = PendingIntent.getActivity(context, 0, Intent(context, MainActivity::class.java).apply { action = "ACTION_CALC" }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      views.setOnClickPendingIntent(context.resources.getIdentifier("btn_wid_calc", "id", context.packageName), piCalc)
                      val piCoin = PendingIntent.getActivity(context, 1, Intent(context, MainActivity::class.java).apply { action = "ACTION_COIN" }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      views.setOnClickPendingIntent(context.resources.getIdentifier("btn_wid_coin", "id", context.packageName), piCoin)
                      val piSci = PendingIntent.getActivity(context, 2, Intent(context, MainActivity::class.java).apply { action = "ACTION_SCI" }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      views.setOnClickPendingIntent(context.resources.getIdentifier("btn_wid_sci", "id", context.packageName), piSci)
                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#141824" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#1E2538" android:pathData="M0,54h108v54h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#262F45" android:pathData="M33,24h42c3.3,0,6,2.7,6,6v48c0,3.3,-2.7,6,-6,6H33c-3.3,0,-6,-2.7,-6,-6V30c0,-3.3,2.7,-6,6,-6z"/>
              <path android:fillColor="#0D0F14" android:pathData="M33,30h42v14H33z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M33,50h11v11H33zM48.5,50h11v11h-11zM33,65h11v11H33zM48.5,65h11v11h-11z"/>
              <path android:fillColor="#64B5F6" android:pathData="M64,50h11v11H64z"/>
              <path android:fillColor="#00E676" android:pathData="M64,65h11v11H64z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "NativeCalculator"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.calculator'
              compileSdk 34
              defaultConfig { applicationId "com.example.calculator"; minSdk 26; targetSdk 34; versionCode 13; versionName "13.0-Pro" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="מחשבון Pro" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:supportsRtl="false" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:supportsPictureInPicture="true" android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".CalculatorWidget" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
                  </receiver>

                  <service android:name=".MiniCalcTileService" android:icon="@drawable/ic_calc_tile" android:label="מיני מחשבון" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE" android:exported="true">
                      <intent-filter><action android:name="android.service.quicksettings.action.QS_TILE" /></intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Build Signed Native APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
