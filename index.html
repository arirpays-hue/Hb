<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מחשבון</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
        }

        .display-container {
            width: 100%;
            text-align: right;
            padding: 20px 10px;
            margin-bottom: 10px;
            word-wrap: break-word;
            word-break: break-all;
        }

        .previous-operand {
            color: #888888;
            font-size: 1.4rem;
            min-height: 2rem;
            margin-bottom: 8px;
        }

        .current-operand {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 300;
            min-height: 4.2rem;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding-bottom: 10px;
        }

        button {
            border: none;
            outline: none;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 1.7rem;
            height: 75px;
            border-radius: 24px;
            cursor: pointer;
            transition: transform 0.08s ease, background-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.93);
            background-color: #3d3d3d;
        }

        .btn-top {
            background-color: #3b3b3b;
            color: #00e676;
            font-weight: 500;
        }

        .btn-clear {
            background-color: #3b2323;
            color: #ff5252;
            font-weight: 600;
        }

        .btn-operator {
            background-color: #1e3a5f;
            color: #64b5f6;
            font-size: 2rem;
        }

        .btn-equals {
            background-color: #00c853;
            color: #000000;
            font-weight: bold;
            font-size: 2.2rem;
        }

        .btn-equals:active {
            background-color: #00e676;
        }

        .span-two {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="display-container">
        <div class="previous-operand" id="prev-display"></div>
        <div class="current-operand" id="curr-display">0</div>
    </div>

    <div class="buttons-grid">
        <button class="btn-clear" onclick="clearAll()">AC</button>
        <button class="btn-top" onclick="deleteLast()">⌫</button>
        <button class="btn-top" onclick="chooseOperation('%')">%</button>
        <button class="btn-operator" onclick="chooseOperation('÷')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="btn-operator" onclick="chooseOperation('×')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="btn-operator" onclick="chooseOperation('-')">−</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="btn-operator" onclick="chooseOperation('+')">+</button>

        <button class="span-two" onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="btn-equals" onclick="compute()">=</button>
    </div>

    <script>
        let currentOperand = '0';
        let previousOperand = '';
        let operation = null;

        const currDisplay = document.getElementById('curr-display');
        const prevDisplay = document.getElementById('prev-display');

        function updateDisplay() {
            currDisplay.innerText = currentOperand;
            if (operation != null) {
                prevDisplay.innerText = `${previousOperand} ${operation}`;
            } else {
                prevDisplay.innerText = '';
            }
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number.toString();
            } else {
                if (currentOperand.length >= 12) return;
                currentOperand = currentOperand.toString() + number.toString();
            }
            updateDisplay();
        }

        function clearAll() {
            currentOperand = '0';
            previousOperand = '';
            operation = null;
            updateDisplay();
        }

        function deleteLast() {
            if (currentOperand.length === 1 || currentOperand === 'Error') {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.toString().slice(0, -1);
            }
            updateDisplay();
        }

        function chooseOperation(op) {
            if (currentOperand === 'Error') clearAll();
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '0';
            updateDisplay();
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '×':
                    computation = prev * current;
                    break;
                case '÷':
                    if (current === 0) {
                        currentOperand = 'Error';
                        previousOperand = '';
                        operation = null;
                        updateDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                case '%':
                    computation = (prev / 100) * current;
                    break;
                default:
                    return;
            }

            currentOperand = Math.round(computation * 100000000) / 100000000 + '';
            operation = null;
            previousOperand = '';
            updateDisplay();
        }
    </script>
</body>
  </html>
